name: Pages

# Three separate jobs, so each one shows its own pass/fail mark in the Actions UI and on a PR:
#   checks  - typecheck, unit tests of the site and of the indexer scripts (the verification harness)
#   build   - generate the catalog index, vite build and the dist checks (does the site build at all)
#   deploy  - publish to GitHub Pages, only after both of the above succeed
# Pull requests into main run checks and build. Push to main, a pushed release tag or a manual run also deploys.
#
# The catalog data (site/public/index.json, releases.json, bodies/, ...) is not committed. The build job
# generates it with scripts/build-index.mjs, which reads marketplace.json, plugins/ and the git tags, so it
# checks out the full history (fetch-depth: 0) to have every tag.
#
# A pushed release tag <plugin>--v<version> only exists to refresh the releases list. The site always shows
# the state of main, so for a tag (pushed or picked as the ref of a manual run) both jobs check out `main`,
# never the tagged commit: an old or misplaced tag must not publish a stale site. A tag on a commit that is
# not on main therefore just republishes main (and lists the tag with empty notes if main's CHANGELOG.md
# has no section for it). Pull requests keep using the merge commit, push and dispatch use the pushed commit.
# Deploying from a tag run needs the github-pages environment to allow tags matching *--v*
# (Settings > Environments > github-pages > Deployment branches and tags).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*--v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; PR builds get their own group so they never queue behind a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && 'main' || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Generated files are not committed
        working-directory: .
        run: |
          tracked="$(git ls-files site/dist 'site/public/*.json' site/public/llms.txt site/public/feed.xml site/public/bodies)"
          if [ -n "$tracked" ]; then
            echo "::error::generated files must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Indexer script tests
        working-directory: .
        run: npm test

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && 'main' || github.sha }}
          fetch-depth: 0 # all history and tags: releases.json is built from CHANGELOG.md and git tags

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Generate the catalog index
        working-directory: .
        run: node scripts/build-index.mjs

      - run: npm ci
      - name: Build
        run: npx vite build
      - name: Check dist
        run: node scripts/check-dist.mjs
        env:
          REQUIRE_REAL_DATA: '1'

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
