<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search, mobile — test-ai-marketplace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.theme-dark{color-scheme:dark;--bg:#161B26;--surface:#1D2331;--surface-raised:#262D3E;--border:#353D51;--text:#E7EAF1;--text-muted:#A4ACBE;--accent:#A9B6FF;--accent-hover:#C6CEFF;--accent-contrast:#151A33;--focus-ring:#C6CEFF;--mark-bg:#5B4A1A;--mark-fg:#FFE8AE;--warning-bg:#3A2B12;--warning-border:#6B4E1E;--warning-text:#F6C36E;--code-bg:#11151E;--type-plugin-bg:#2B3256;--type-plugin-fg:#CDD5FF;--type-skill-bg:#173B37;--type-skill-fg:#86E3D2;--type-agent-bg:#3E2440;--type-agent-fg:#F5B0E0;--type-command-bg:#29371C;--type-command-fg:#BFE68F}
.theme-light{color-scheme:light;--bg:#F3F4F7;--surface:#FFFFFF;--surface-raised:#FFFFFF;--border:#D6DAE3;--text:#1B2030;--text-muted:#566074;--accent:#3346B8;--accent-hover:#28399E;--accent-contrast:#FFFFFF;--focus-ring:#3346B8;--mark-bg:#FFE49A;--mark-fg:#3A2A00;--warning-bg:#FFF2D9;--warning-border:#F0C979;--warning-text:#6E4600;--code-bg:#EEF0F5;--type-plugin-bg:#E4E8FF;--type-plugin-fg:#2D3C9E;--type-skill-bg:#D9F3EE;--type-skill-fg:#0D5E52;--type-agent-bg:#F8E1F1;--type-agent-fg:#8A2468;--type-command-bg:#E6F2D6;--type-command-fg:#3D5E12}
.ui{font-family:'Schibsted Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:'calt' 0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);font:inherit;font-size:15px;font-weight:500;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap;touch-action:manipulation}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.btn-icon{width:44px;padding:0}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;line-height:1;white-space:nowrap}
.badge .ico{width:13px;height:13px}
.t-skill{background:var(--type-skill-bg);color:var(--type-skill-fg)}
.t-agent{background:var(--type-agent-bg);color:var(--type-agent-fg)}
.t-command{background:var(--type-command-bg);color:var(--type-command-fg)}
.t-plugin{background:var(--type-plugin-bg);color:var(--type-plugin-fg)}
.warn{background:var(--warning-bg);color:var(--warning-text);border:1px solid var(--warning-border)}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 1px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.title-link{color:var(--text);text-decoration:none}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font:inherit;font-size:13px}
.searchbox:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.select{height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background-color:var(--surface-raised);color:var(--text);font:inherit;font-size:15px}
</style>
</helmet>
<div class="ui theme-{{theme}}" style="width: 100%; min-height: 100%;">
<header style="position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
<a href="#" style="display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="2" fill="var(--accent)"></rect><rect x="12" y="1" width="9" height="9" rx="2" fill="none" stroke="var(--accent)" stroke-width="2"></rect><rect x="1" y="12" width="9" height="9" rx="2" fill="none" stroke="var(--accent)" stroke-width="2"></rect><rect x="12" y="12" width="9" height="9" rx="2" fill="none" stroke="var(--accent)" stroke-width="2"></rect></svg>
<span class="mono" style="font-weight: 600; font-size: 14px;" translate="no">test-ai-marketplace</span>
</a>
<button class="btn btn-ghost btn-icon" type="button" aria-label="Open menu" aria-expanded="false" style="margin-right: -10px;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"></path></svg></button>
</div>
<label for="mq" class="sr-only">Search plugins, skills, agents</label>
<div class="searchbox" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 2px 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;">
<svg class="ico" style="color: var(--text-muted);" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-4.35-4.35"></path></svg>
<input id="mq" type="search" role="searchbox" value="code review" readonly="readonly" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 16px; outline: none;">
<button class="btn btn-ghost btn-icon" type="button" aria-label="Clear search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18 M6 6l12 12"></path></svg></button>
</div>
</header>

<main style="padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px;">
<h1 class="sr-only">Search the catalog</h1>
<div style="display: flex; align-items: center; gap: 8px;">
<p aria-live="polite" style="margin: 0; font-weight: 600; font-variant-numeric: tabular-nums;">8 results</p>
<button class="btn" type="button" style="margin-left: auto;"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18 M7 12h10 M10 18h4"></path></svg>Filters</button>
<label for="ms" class="sr-only">Sort</label>
<select id="ms" class="select"><option>Relevance</option><option>Name (A–Z)</option><option>Recently updated</option></select>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="4">
<li class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; gap: 6px; flex-wrap: wrap;">
<span class="badge {{item.cls}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{item.icon}}"></path></svg>{{item.typeLabel}}</span>
<sc-if value="{{item.exec}}" hint-placeholder-val="{{false}}"><span class="badge warn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01"></path></svg>Executes code</span></sc-if>
</div>
<h3 class="mono" style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere;" translate="no"><a class="title-link" href="#"><span style="color: var(--text-muted);">{{item.prefix}}</span><sc-for list="{{item.nameParts}}" as="p"><sc-if value="{{p.m}}"><mark>{{p.t}}</mark></sc-if><sc-if value="{{p.n}}"><span>{{p.t}}</span></sc-if></sc-for></a></h3>
<p style="margin: 0; font-size: 13px; color: var(--text-muted);">{{item.meta}}</p>
<p style="margin: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;"><sc-for list="{{item.descParts}}" as="p"><sc-if value="{{p.m}}"><mark>{{p.t}}</mark></sc-if><sc-if value="{{p.n}}"><span>{{p.t}}</span></sc-if></sc-for></p>
<div style="display: flex; gap: 6px; flex-wrap: wrap;"><sc-for list="{{item.tags}}" as="tag"><button class="tag" type="button">{{tag}}</button></sc-for></div>
<div style="display: flex; gap: 8px; padding-top: 4px;">
<button class="btn btn-primary" type="button" style="flex: 1;" aria-label="Copy install command for plugin {{item.plugin}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h12v12H8z M16 8V4H4v12h4"></path></svg>Copy install</button>
<a class="btn" href="#">View</a>
<a class="btn btn-icon" href="#" aria-label="View source on GitHub"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4 M9 18c-4.51 2-5-2-7-2"></path></svg></a>
</div>
</li>
</sc-for>
</ul>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      plugin: "M16.5 9.4 7.55 4.24 M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z M3.27 6.96 12 12.01l8.73-5.05 M12 22.08V12",
      skill: "M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z",
      agent: "M12 8V4H8 M4 8h16v12H4z M2 14h2 M20 14h2 M9 13v2 M15 13v2",
      command: "M3 3h18v18H3z M7 15l3-3-3-3 M12 15h5"
    };
    var L = { plugin: "Plugin", skill: "Skill", agent: "Agent", command: "Command" };
    function hl(s) {
      return s.split(/(code-review|code|review)/i).filter(function (t) { return t !== ""; }).map(function (t) {
        var m = /^(code-review|code|review)$/i.test(t);
        return { t: t, m: m, n: !m };
      });
    }
    function item(type, plugin, name, meta, desc, tags, exec) {
      return {
        cls: "t-" + type, icon: I[type], typeLabel: L[type], plugin: plugin,
        prefix: type === "plugin" ? "" : plugin + ":", nameParts: hl(name), meta: meta,
        descParts: hl(desc), tags: tags, exec: !!exec
      };
    }
    return {
      theme: this.props.theme ?? "dark",
      items: [
        item("skill", "engineering-paved-path", "code-review", "in engineering-paved-path · v1.2.0", "Code review checklist for pull requests: correctness, tests, security, readability.", ["review", "pull-request", "+3"]),
        item("agent", "engineering-paved-path", "code-reviewer", "in engineering-paved-path · v1.2.0", "Reviews a diff against the team’s paved-path conventions and reports blocking issues first.", ["review", "engineering", "+2"]),
        item("command", "engineering-paved-path", "review-pr", "in engineering-paved-path · v1.2.0", "Review the current pull request with the code-reviewer agent.", ["review", "engineering", "+2"]),
        item("plugin", "engineering-paved-path", "engineering-paved-path", "v1.2.0 · 3 skills, 1 agent, 1 command, hooks", "Team engineering conventions: React best practices, code review, commit conventions and guard hooks.", ["engineering", "react", "+2"], true)
      ]
    };
  }
}
</script>
</body>
</html>
